<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuripantis - Cambiar contraseña</title>
<style>
  :root { --crema:#fff7f0; --tinta:#17161a; --rosa:#ff3e7f; --amarillo:#ffc93c; --cian:#2fd3c6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: var(--cian); font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  .card { background: var(--crema); border:4px solid var(--tinta); box-shadow:8px 8px 0 var(--tinta);
    border-radius:16px; padding:40px; width:100%; max-width:360px; transform: rotate(1deg); }
  .card h1 { margin:0 0 24px; text-align:center; color:var(--tinta); font-size:1.4rem; }
  label { display:block; margin-bottom:6px; font-weight:600; color:var(--tinta); }
  input { width:100%; padding:10px 12px; margin-bottom:16px; border:3px solid var(--tinta);
    border-radius:8px; font-size:1rem; }
  button { width:100%; padding:12px; background:var(--rosa); color:var(--crema); font-weight:700;
    border:3px solid var(--tinta); border-radius:8px; cursor:pointer; font-size:1rem; }
  button:hover { background: var(--amarillo); color: var(--tinta); }
  #mensaje { font-weight:600; margin-bottom:12px; min-height:1.2em; text-align:center; }
  #mensaje.error { color: var(--rosa); }
  #mensaje.ok { color: #159c73; }
  a.volver { display:block; text-align:center; margin-top:16px; color:var(--tinta); }
</style>
</head>
<body>
  <form class="card" id="cambiarForm">
    <h1>Cambiar contraseña</h1>
    <div id="mensaje"></div>
    <label for="actual">Contraseña actual</label>
    <input type="password" id="actual" required>
    <label for="nueva">Contraseña nueva</label>
    <input type="password" id="nueva" required>
    <label for="confirmar">Confirmar contraseña nueva</label>
    <input type="password" id="confirmar" required>
    <button type="submit">Guardar</button>
    <a class="volver" href="/index.html">← Volver al dashboard</a>
  </form>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/cambiar-password.js"></script>
</body>
</html>
